<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>INSERT → COMMIT → 체크포인트 단계별 시뮬레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2f4; --surface:#ffffff; --ink:#14232b; --muted:#5a6b75; --line:#cfd9de;
  --accent:#0b6e78; --mem:#e0a526; --disk:#0b6e78; --dirty:#c8452d;
  --hot:#0b6e78; --code-bg:#13242c; --code-ink:#dbe8ec;
  --crash-bg:#fdeae5; --crash-ink:#7a2412;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a20; --surface:#16252d; --ink:#e4eef2; --muted:#93a7b0; --line:#2a3d47;
    --accent:#4cc3cf; --mem:#f0b73a; --disk:#4cc3cf; --dirty:#ff8a6b; --hot:#4cc3cf;
    --code-bg:#0a1318; --code-ink:#d4e4e9; --crash-bg:#3b1f18; --crash-ink:#ffc2b3;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a20; --surface:#16252d; --ink:#e4eef2; --muted:#93a7b0; --line:#2a3d47;
  --accent:#4cc3cf; --mem:#f0b73a; --disk:#4cc3cf; --dirty:#ff8a6b; --hot:#4cc3cf;
  --code-bg:#0a1318; --code-ink:#d4e4e9; --crash-bg:#3b1f18; --crash-ink:#ffc2b3;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;font-size:16px;-webkit-text-size-adjust:100%}
main{max-width:820px;margin:0 auto;padding:36px 16px 80px}
h1{font-size:clamp(24px,5vw,32px);line-height:1.3;margin:0 0 10px;letter-spacing:-.02em;font-weight:700}
.lead{color:var(--muted);margin:0 0 24px}
code{font-family:var(--mono);font-size:.88em;background:color-mix(in srgb,var(--accent) 12%,transparent);padding:1px 6px;border-radius:4px}

.steps{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;padding:0;list-style:none}
.steps button{min-width:40px;height:40px;padding:0 10px;border-radius:20px;font-weight:600}
.steps button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:#fff}
.steps button.done{border-color:var(--accent);color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .steps button[aria-current="step"]{color:#06181c}}
:root[data-theme="dark"] .steps button[aria-current="step"]{color:#06181c}

button{font-family:var(--sans);font-size:15px;font-weight:500;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:42px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{color:#06181c}}
:root[data-theme="dark"] button.primary{color:#06181c}

.sql{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:14px;padding:12px 16px;border-radius:8px;margin:0 0 14px;overflow-x:auto;white-space:pre}

.board{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lane{display:grid;grid-template-columns:150px 1fr;border-top:1px solid var(--line);min-height:76px;position:relative}
.lane:first-child{border-top:0}
.lane.firstdisk{border-top:2px dashed var(--muted)}
.lane .lab{padding:10px 12px;border-left:5px solid var(--mem);font-weight:600;font-size:14px;line-height:1.35}
.lane.disk .lab{border-left-color:var(--disk)}
.lane .lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.lane .body{padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lane.hot{background:color-mix(in srgb,var(--hot) 9%,transparent);box-shadow:inset 0 0 0 2px var(--hot)}
.empty{color:var(--muted);font-size:13px}

.chip{border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.35;animation:pop .35s ease}
.chip.page{display:flex;flex-direction:column;border:2px solid var(--mem);background:color-mix(in srgb,var(--mem) 14%,transparent);min-width:110px}
.lane.disk .chip.page{border-color:var(--disk);background:color-mix(in srgb,var(--disk) 12%,transparent)}
.chip.page span:first-child{font-weight:600}
.chip.page.dirtyc{border-color:var(--dirty)}
.chip.page em{font-style:normal;color:var(--dirty);font-weight:700;font-size:12px}
.chip.rec{font-family:var(--mono);border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.chip.rec.new{border-color:var(--accent)}
.chip.mark{border:2px dashed var(--accent);color:var(--accent);font-weight:600}
.chip.ctl{font-family:var(--mono);border:2px solid var(--disk)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.chip{animation:none}}

.panel{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.panel h2{margin:0 0 8px;font-size:19px;letter-spacing:-.01em}
.panel p{margin:0 0 10px}
.panel ul{margin:0 0 10px;padding-left:20px}
.panel li{margin-bottom:4px}
.why{border-top:1px solid var(--line);padding-top:10px;color:var(--muted);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.crash{margin-top:14px}
.crashout{margin-top:10px;background:var(--crash-bg);color:var(--crash-ink);border-radius:8px;padding:12px 16px;font-size:15px}
.crashout b{display:block;margin-bottom:2px}
.hint{color:var(--muted);font-size:13px;margin-top:10px}

@media (max-width:560px){
  .lane{grid-template-columns:1fr}
  .lane .lab{border-left-width:5px;padding-bottom:2px}
  .lane .lab small{display:inline;margin-left:6px}
}
</style>
</head>
<body>
<main>
  <h1>INSERT → COMMIT → 체크포인트, 한 단계씩 눌러보기</h1>
  <p class="lead">전체 동작 과정을 단계별로 쪼갰어요. 다음 버튼(또는 키보드 ← →)으로 넘기면서 어느 영역에 무엇이 생기고 바뀌는지 보세요. 각 단계에서 "지금 서버가 죽으면?"도 눌러볼 수 있습니다.</p>

  <ol class="steps" id="stepList" aria-label="단계 목록"></ol>

  <div class="sql" id="sql"></div>

  <div class="board" id="board"></div>

  <section class="panel" aria-live="polite">
    <h2 id="title"></h2>
    <div id="what"></div>
    <p class="why" id="why"></p>
    <div class="crash">
      <button type="button" id="crashBtn">이 시점에 서버가 죽으면?</button>
      <div class="crashout" id="crashOut" hidden></div>
    </div>
    <div class="nav">
      <button type="button" id="prev">이전</button>
      <button type="button" class="primary" id="next">다음 단계</button>
    </div>
    <div class="hint">색 테두리가 칠해진 영역이 이번 단계에서 바뀐 곳이에요. 점선 위쪽은 메모리, 아래쪽은 디스크입니다.</div>
  </section>
</main>

<script>
(function(){
  var LANES = [
    {id:"shared", name:"Shared Buffer", sub:"메모리", kind:"mem"},
    {id:"walbuf", name:"WAL Buffer", sub:"메모리", kind:"mem"},
    {id:"walseg", name:"WAL Segment", sub:"디스크", kind:"disk", first:true},
    {id:"disk",   name:"Database Cluster", sub:"디스크 · 데이터 파일", kind:"disk"},
    {id:"ctl",    name:"pg_control", sub:"디스크 · 제어 파일", kind:"disk"}
  ];

  function page(lsn, tuple, dirty){
    return '<div class="chip page'+(dirty?' dirtyc':'')+'"><span>T1 페이지</span><span>LSN_'+lsn+'</span><span>'+(tuple?'튜플 "A"':'비어 있음')+'</span>'+(dirty?'<em>dirty</em>':'')+'</div>';
  }
  function rec(t, isNew){ return '<div class="chip rec'+(isNew?' new':'')+'">'+t+'</div>'; }
  function mark(){ return '<div class="chip mark">Redo 포인트 ▸</div>'; }
  function ctl(t){ return '<div class="chip ctl">'+t+'</div>'; }

  var OLDCP = rec('CHECKPOINT (이전)');

  var STEPS = [
    {
      t:"시작 상태",
      sql:"-- 아직 아무 SQL도 실행하지 않음",
      what:"<p>디스크의 T1 테이블 페이지는 비어 있고 LSN은 0입니다. 메모리 영역(Shared Buffer, WAL Buffer)도 비어 있어요.</p><p><code>pg_control</code>에는 지난 체크포인트가 남긴 Redo 포인트(LSN_0)가 적혀 있습니다.</p>",
      why:"이 상태가 \"모든 변경이 디스크에 반영된 깨끗한 상태\"예요. 여기서 출발합니다.",
      hot:[],
      s:{shared:[], walbuf:[], walseg:[OLDCP], disk:[page(0,false,false)], ctl:[ctl('Redo 포인트 = LSN_0')]},
      crash:["복구할 게 없어요.","잃을 데이터가 없는 상태라 정상 기동합니다."]
    },
    {
      t:"① 페이지를 메모리로 읽어 온다",
      sql:"BEGIN;\nINSERT INTO t1 VALUES ('A');",
      what:"<p>T1 테이블의 페이지가 Shared Buffer에 없어서, 디스크에서 <b>복사해서 읽어 옵니다.</b> 이때 LSN은 아직 0이에요.</p><p>디스크의 원본 페이지는 그대로 있습니다. 읽어 오기만 한 거예요.</p>",
      why:"PostgreSQL은 데이터를 디스크에서 직접 고치지 않고, 항상 메모리로 올려서 고칩니다.",
      hot:["shared","disk"],
      s:{shared:[page(0,false,false)], walbuf:[], walseg:[OLDCP], disk:[page(0,false,false)], ctl:[ctl('Redo 포인트 = LSN_0')]},
      crash:["아무 문제 없어요.","메모리에 읽기만 했고 아무것도 바꾸지 않았습니다."]
    },
    {
      t:"② 튜플 A를 넣고, WAL 레코드를 만든다",
      sql:"BEGIN;\nINSERT INTO t1 VALUES ('A');   -- 실행됨",
      what:"<ul><li>메모리의 페이지에 튜플 \"A\"를 저장 → 페이지가 <b>dirty</b>가 됩니다.</li><li>같은 변경을 설명하는 <b>WAL 레코드</b>(INSERT A)를 WAL Buffer에 기록합니다.</li><li>페이지의 LSN이 0에서 1로 바뀝니다. \"이 페이지는 LSN_1 레코드까지 반영됨\"이라는 표시예요.</li></ul>",
      why:"디스크에는 아직 아무것도 안 갔어요. 데이터 파일도, WAL 파일도 그대로입니다. 전부 메모리에만 있어요.",
      hot:["shared","walbuf"],
      s:{shared:[page(1,true,true)], walbuf:[rec('INSERT A @LSN_1',true)], walseg:[OLDCP], disk:[page(0,false,false)], ctl:[ctl('Redo 포인트 = LSN_0')]},
      crash:["A가 사라져요. 그런데 정상이에요.","INSERT는 커밋 전이었고 WAL이 디스크에 없으므로 A는 없던 일이 됩니다. 사용자도 아직 \"커밋 완료\"를 받지 못했으니 약속을 어긴 게 아니에요."]
    },
    {
      t:"③ COMMIT: 커밋 레코드를 만든다",
      sql:"COMMIT;",
      what:"<ul><li>트랜잭션이 잡고 있던 <b>잠금이 해제</b>되어 다른 트랜잭션이 A를 볼 수 있게 됩니다.</li><li><b>커밋 레코드</b>를 WAL Buffer에 추가합니다.</li></ul><p>아직 사용자에게 \"커밋 완료\"라고 답하기 전이에요.</p>",
      why:"커밋 레코드까지 WAL Buffer에 있을 뿐, 디스크에는 아직 없습니다. 바로 다음 단계에서 내려가요.",
      hot:["walbuf"],
      s:{shared:[page(1,true,true)], walbuf:[rec('INSERT A @LSN_1'), rec('COMMIT',true)], walseg:[OLDCP], disk:[page(0,false,false)], ctl:[ctl('Redo 포인트 = LSN_0')]},
      crash:["A가 사라져요. 아직은 정상이에요.","커밋 레코드가 메모리(WAL Buffer)에만 있고, 사용자에게 \"커밋 완료\" 응답도 가기 전이라서 일관성이 깨지지 않습니다."]
    },
    {
      t:"④ WAL Buffer를 WAL 파일로 flush한다",
      sql:"COMMIT;   -- flush 완료 후 \"COMMIT\" 응답",
      what:"<p>WAL Buffer의 <b>INSERT A와 COMMIT 레코드가 WAL Segment 파일로 flush</b>됩니다. 이게 끝나야 사용자에게 \"커밋 완료\"를 응답해요.</p><p>하지만 <b>데이터 파일(Database Cluster)은 아직 LSN_0, 비어 있는 그대로</b>입니다. Dirty 페이지는 메모리에만 있어요.</p>",
      why:"WAL Buffer의 A/commit 레코드가 아래 WAL Segment로 안전하게 내려가는 단계입니다. \"커밋한 데이터는 잃지 않는다\"가 여기서 보장돼요.",
      hot:["walbuf","walseg"],
      s:{shared:[page(1,true,true)], walbuf:[], walseg:[OLDCP, rec('INSERT A @LSN_1',true), rec('COMMIT',true)], disk:[page(0,false,false)], ctl:[ctl('Redo 포인트 = LSN_0')]},
      crash:["A는 안전해요. 복구 때 되살아납니다.","데이터 파일에는 A가 없지만 WAL에 INSERT A와 COMMIT이 있어요. 재시작하면 pg_control의 Redo 포인트(LSN_0)부터 WAL을 읽어 A를 다시 넣습니다. 커밋된 데이터를 잃지 않아요."]
    },
    {
      t:"⑤ 체크포인트 시작",
      sql:"-- 백그라운드에서 체크포인트 시작 (자동 또는 CHECKPOINT;)",
      what:"<ul><li>현재 WAL 위치를 <b>새 Redo 포인트 후보</b>로 기록해 둡니다.</li><li>Shared Buffer의 dirty 페이지들에 \"이번에 디스크로 보낼 대상\" 표식을 붙입니다.</li></ul><p><code>pg_control</code>은 아직 <b>예전 값(LSN_0)</b> 그대로예요.</p>",
      why:"참고: 실제로는 Redo 위치만 시작 시점에 정해 두고, 체크포인트 완료 레코드는 dirty 페이지의 flush가 끝난 뒤에 WAL에 최종 기록합니다.",
      hot:["walseg"],
      s:{shared:[page(1,true,true)], walbuf:[], walseg:[OLDCP, rec('INSERT A @LSN_1'), rec('COMMIT'), mark()], disk:[page(0,false,false)], ctl:[ctl('Redo 포인트 = LSN_0 (아직 예전 값)')]},
      crash:["A는 안전해요. 복구도 이전과 같아요.","체크포인트가 끝나지 않았으니 pg_control은 여전히 LSN_0을 가리킵니다. 미완성 체크포인트는 무시하고 LSN_0부터 WAL을 다시 적용해 A를 복원해요."]
    },
    {
      t:"⑥ Dirty 페이지를 데이터 파일로 flush",
      sql:"-- 체크포인트 진행 중: dirty 페이지 → 디스크",
      what:"<p>표식이 붙은 dirty 페이지가 <b>디스크의 데이터 파일로 기록</b>됩니다. 이제 디스크의 T1 페이지도 LSN_1, 튜플 A를 가집니다.</p><p>메모리의 페이지는 <b>삭제되지 않고 그대로 남아</b> 있어요. 다만 더 이상 dirty가 아니라 \"디스크와 같은 상태\"가 됩니다.</p>",
      why:"체크포인트는 WAL을 읽는 작업이 아니라, 메모리의 dirty 페이지를 디스크로 내리는(Flush) 작업이에요.",
      hot:["shared","disk"],
      s:{shared:[page(1,true,false)], walbuf:[], walseg:[OLDCP, rec('INSERT A @LSN_1'), rec('COMMIT'), mark()], disk:[page(1,true,false)], ctl:[ctl('Redo 포인트 = LSN_0 (아직 예전 값)')]},
      crash:["A는 안전해요. 이미 데이터 파일에도 있어요.","pg_control은 아직 LSN_0이라서 WAL을 LSN_0부터 다시 읽지만, 페이지의 LSN(LSN_1)이 이미 그 레코드 이상이므로 \"이미 반영됨\"으로 보고 건너뜁니다."]
    },
    {
      t:"⑦ 체크포인트 종료",
      sql:"-- 체크포인트 완료",
      what:"<ul><li>체크포인트 완료 레코드를 WAL에 기록합니다.</li><li><code>pg_control</code>의 Redo 포인트를 <b>새 위치로 갱신</b>합니다.</li></ul><p>이제 \"이 위치 이전의 변경은 모두 데이터 파일에 반영됐다\"는 기준점이 확정됐어요.</p>",
      why:"pg_control 갱신은 항상 맨 마지막이에요. 모든 flush가 끝나기 전에 기준점을 앞으로 옮기면 안 되기 때문입니다. 이제 이 위치 이전의 WAL 세그먼트는 재활용하거나 아카이브할 수 있어요.",
      hot:["walseg","ctl"],
      s:{shared:[page(1,true,false)], walbuf:[], walseg:[OLDCP, rec('INSERT A @LSN_1'), rec('COMMIT'), mark(), rec('CHECKPOINT (완료)',true)], disk:[page(1,true,false)], ctl:[ctl('Redo 포인트 = LSN_1 이후 (갱신됨)')]},
      crash:["A는 안전하고, 복구도 빨라요.","pg_control이 새 Redo 포인트를 가리키므로 그 이후의 WAL만 읽으면 됩니다. 앞의 INSERT A, COMMIT은 이미 데이터 파일에 반영됐으니 다시 볼 필요가 없어요."]
    }
  ];

  var cur = 0;
  var $ = function(id){return document.getElementById(id)};
  var board = $("board"), list = $("stepList");

  LANES.forEach(function(l){
    var d = document.createElement("div");
    d.className = "lane " + l.kind + (l.first ? " firstdisk" : "");
    d.id = "lane-" + l.id;
    d.innerHTML = '<div class="lab">'+l.name+'<small>'+l.sub+'</small></div><div class="body"></div>';
    board.appendChild(d);
  });

  STEPS.forEach(function(s,i){
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = i;
    b.setAttribute("aria-label", i + "단계: " + s.t);
    b.onclick = function(){go(i)};
    li.appendChild(b);
    list.appendChild(li);
  });

  function go(n){
    cur = Math.max(0, Math.min(STEPS.length-1, n));
    var s = STEPS[cur];
    $("sql").textContent = s.sql;
    $("title").textContent = s.t;
    $("what").innerHTML = s.what;
    $("why").textContent = s.why;
    $("crashOut").hidden = true;
    $("crashBtn").textContent = "이 시점에 서버가 죽으면?";
    LANES.forEach(function(l){
      var el = $("lane-" + l.id);
      var items = s.s[l.id];
      el.querySelector(".body").innerHTML = items.length ? items.join("") : '<span class="empty">(비어 있음)</span>';
      el.classList.toggle("hot", s.hot.indexOf(l.id) >= 0);
    });
    Array.prototype.forEach.call(list.querySelectorAll("button"), function(b,i){
      if(i === cur) b.setAttribute("aria-current","step"); else b.removeAttribute("aria-current");
      b.classList.toggle("done", i < cur);
    });
    $("prev").disabled = cur === 0;
    $("next").disabled = cur === STEPS.length-1;
    $("next").textContent = cur === STEPS.length-1 ? "끝" : "다음 단계";
  }

  $("prev").onclick = function(){go(cur-1)};
  $("next").onclick = function(){go(cur+1)};
  $("crashBtn").onclick = function(){
    var o = $("crashOut"), s = STEPS[cur];
    if(o.hidden){
      o.innerHTML = "<b>"+s.crash[0]+"</b>"+s.crash[1];
      o.hidden = false;
      $("crashBtn").textContent = "닫기";
    } else {
      o.hidden = true;
      $("crashBtn").textContent = "이 시점에 서버가 죽으면?";
    }
  };
  document.addEventListener("keydown", function(e){
    if(e.key === "ArrowRight") go(cur+1);
    else if(e.key === "ArrowLeft") go(cur-1);
  });
  go(0);
})();
</script>
</body>
</html>
